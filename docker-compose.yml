version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: memora-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=memora_api_db

  memora-api:
    build: .
    container_name: memora-api-app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/memora_api_db

volumes:
  mongo_data: