name: Memora CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Clona o código do repositório na máquina virtual do GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura o JDK 21 (Eclipse Temurin) com cache para agilizar builds futuros
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Compila o projeto e executa a suíte de testes unitários
      - name: Build and run tests with Maven
        run: mvn clean test

      # 4. (Opcional) Validação de build do pacote JAR
      - name: Package JAR
        run: mvn package -DskipTests